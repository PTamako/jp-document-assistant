# Generated from v0.11 confirmed Worker routes. Do not list planned-only routes here.
openapi: 3.1.0
info:
  title: 日本生活文书助手 API（基于实际 Worker 路由的开发契约）
  version: 0.11.1-implementation
  description: 以 v0.11 为最高优先约束。契约只列已实现且可由 worker/index.js 路由的操作。OAuth / 苹果邮件自动收信 / 实际跨 App 成功 / 生产部署不属于已实现能力。一个正式
    Worker+D1+私有R2，不创建预览环境。全部写接口要求同源和 CSRF，关键外部写入强制独立 Idempotency-Key。
servers:
- url: https://EXAMPLE_PRODUCTION_DOMAIN
  description: 尚未正式部署，非可用地址
tags:
- name: System
- name: Auth
- name: Imports
- name: Documents
- name: Integration
- name: Recycle
- name: Backup
- name: Usage
security:
- sessionCookie: []
paths:
  /api/health:
    get:
      tags:
      - System
      summary: 健康检查（不会验证真实 D1/R2 绑定）
      operationId: getHealth
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security: []
  /api/auth/bootstrap:
    post:
      tags:
      - Auth
      summary: 首次初始化唯一家庭和管理员；需 BOOTSTRAP_ADMIN_TOKEN
      operationId: bootstrapHousehold
      responses:
        '201':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: &id001
                  type: string
                  format: email
                password: &id002
                  type: string
                  minLength: 12
                display_name: &id003
                  type: string
                setup_token:
                  type: string
              required:
              - email
              - password
              - setup_token
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: 密码登录并设置 __Host-da_session 安全 Cookie
      operationId: login
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
              - email
              - password
  /api/household/join:
    post:
      tags:
      - Auth
      summary: 邀请令牌加入第二位成员（仅两人）
      operationId: joinHousehold
      responses:
        '201':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: *id001
                password: *id002
                display_name: *id003
                invite_token:
                  type: string
              required:
              - email
              - password
              - invite_token
  /api/auth/logout:
    post:
      tags:
      - Auth
      summary: 撤销当前服务器会话
      operationId: logout
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
  /api/me:
    get:
      tags:
      - Auth
      summary: 当前身份及防伪令牌
      operationId: getMe
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/household/invites:
    post:
      tags:
      - Auth
      summary: 管理员生成仅供指定邮箱的一次性邀请码
      operationId: createInvite
      responses:
        '201':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invitee_email:
                  type: string
                  format: email
              required:
              - invitee_email
  /api/connections:
    get:
      tags:
      - Integration
      summary: 已记录的连接元数据；不会自动完成 OAuth
      operationId: listConnections
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/integrations/status:
    get:
      tags:
      - Integration
      summary: 安全桥配置状态；没有凭证时禁止写入
      operationId: getIntegrationStatus
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/imports/plan:
    post:
      tags:
      - Imports
      summary: 检查格式、大小、OCR 状态和预估上传量
      operationId: planImport
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mime:
                  type: string
                file_size:
                  type: integer
                  minimum: 0
                retention:
                  type: string
                  enum:
                  - summary
                  - analyze_only
                  - original
              required:
              - mime
              - file_size
  /api/documents/import/text:
    post:
      tags:
      - Imports
      summary: 从粘贴文字、本地解析邮件/TXT 明确提交；人工核验
      operationId: importText
      responses:
        '201':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                text:
                  type: string
                  maxLength: 100000
                source_type:
                  type: string
                  enum:
                  - text
                  - local_file
                  - mail_forward
                  - google_drive
                  - gmail
                retention:
                  type: string
                  enum:
                  - summary
                  - analyze_only
              required:
              - text
              - source_type
              - retention
  /api/documents/import/file:
    post:
      tags:
      - Imports
      summary: 主动上传 JPEG/PNG/WebP/PDF 私有 R2；无 OCR 时保留人工修正
      operationId: importFile
      responses:
        '201':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                retention:
                  type: string
                  enum:
                  - original
              required:
              - file
              - retention
  /api/documents:
    get:
      tags:
      - Documents
      summary: 按权限分页搜索私人或明确共享的文书，仅返回轻量元数据
      operationId: listDocuments
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: visibility
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - mine
          - shared
      - name: archived
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - archived
          - all
      - name: favorite
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - 'yes'
      - name: month
        in: query
        required: false
        schema:
          type: string
  /api/today:
    get:
      tags:
      - Documents
      summary: 今日/逾期或待核验的 D1 摘要；不读取 R2
      operationId: listToday
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          type: integer
  /api/integrations:
    get:
      tags:
      - Integration
      summary: 本人联动候选分页列表，不发起外部写入
      operationId: listIntegrationCandidates
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
  /api/documents/{documentId}:
    get:
      tags:
      - Documents
      summary: 文书详情，保留来源字段；只在打开图片时读取 R2
      operationId: getDocument
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
    patch:
      tags:
      - Documents
      summary: 乐观版本控制下修改标题、分类、标签、收藏、归档、主动共享
      operationId: patchDocument
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                category:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                favorite:
                  type: boolean
                archived:
                  type: boolean
                visibility:
                  type: string
                  enum:
                  - private
                  - shared
                confirm_sensitive_share:
                  type: boolean
                version:
                  type: integer
                  minimum: 1
              required:
              - version
  /api/documents/{documentId}/source-text:
    patch:
      tags:
      - Documents
      summary: 人工修改来源文字；有外部联动请求时拒绝重建候选以保留幂等
      operationId: updateSourceText
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  maxLength: 100000
                confirm_reset_review:
                  type: boolean
              required:
              - text
  /api/documents/{documentId}/analyze:
    post:
      tags:
      - Documents
      summary: 用户主动重新分析现有文字，不强制 OCR；无数据自动编造
      operationId: reanalyzeDocument
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
  /api/documents/{documentId}/ocr:
    post:
      tags:
      - Documents
      summary: 按需实验性 OCR，默认关闭；识别为空时失败，不自动入账
      operationId: analyzeImageOptIn
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: boolean
                attachment_id:
                  type: string
              required:
              - confirm
              - attachment_id
  /api/documents/{documentId}/fields:
    get:
      tags:
      - Documents
      summary: 获取字段及原文证据
      operationId: listDocumentFields
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
  /api/fields/{fieldId}:
    patch:
      tags:
      - Documents
      summary: 人工核对金额与日期，已同步远端的字段改动须再次确认
      operationId: reviewField
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: fieldId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                review_state:
                  type: string
                  enum:
                  - confirmed
                  - corrected
                  - rejected
                normalized_value:
                  type: string
                confirm_remote_unchanged:
                  type: boolean
              required:
              - review_state
  /api/documents/{documentId}/candidates:
    get:
      tags:
      - Integration
      summary: 联动候选，未确认不写入
      operationId: listDocumentCandidates
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
  /api/candidates/{candidateId}/preview:
    get:
      tags:
      - Integration
      summary: 查看具体待写入字段与风险
      operationId: previewCandidate
      responses:
        '200':
          description: 成功；实际响应字段以 schema 或代码验收为准
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: candidateId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
  /api/candidates/{candidateId}/commit:
    post:
      tags:
      - Integration
      summary: 用户确认后安全 HMAC 桥接，目标侧按稳定键去重；拒绝未配置服务
      operationId: commitCandidate
