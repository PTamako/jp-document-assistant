components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-da_session
      description: 由服务端颁发、HttpOnly Secure SameSite，须提供同源及 X-CSRF-Token 才能写入。
  responses:
    Error:
      description: 安全失败，code/message；绝不返回敏感日志
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              code:
                type: string
              message:
                type: string
