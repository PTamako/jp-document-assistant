name: TEMP Build PWA icon PNG assets from reviewed SVG
on:
  pull_request:
    paths: ['.github/workflows/build-pwa-icons-temp.yml','web/public/icons/app-icon*.svg']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Render PNGs without replacing SVG sources
        run: |
          python -m pip install --quiet --disable-pip-version-check cairosvg
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib
          import cairosvg
          folder=Path('web/public/icons')
          specs=[('app-icon.svg','app-icon-192.png',192),
                 ('app-icon.svg','app-icon-512.png',512),
                 ('app-icon-maskable.svg','app-icon-maskable-512.png',512),
                 ('app-icon.svg','apple-touch-icon-180.png',180),
                 ('app-icon.svg','favicon-32.png',32)]
          for source,name,size in specs:
            dest=folder/name
            cairosvg.svg2png(url=str(folder/source),write_to=str(dest),output_width=size,output_height=size)
            png=dest.read_bytes()
            if not png.startswith(bytes.fromhex('89504e470d0a1a0a')): raise RuntimeError('Invalid PNG')
            print(f'JPDA_ICON_BEGIN:{name}:{size}:{hashlib.sha256(png).hexdigest()}')
            encoded=base64.b64encode(png).decode()
            for i in range(0,len(encoded),4096):
              print('JPDA_ICON_CHUNK:'+encoded[i:i+4096])
            print(f'JPDA_ICON_END:{name}:{len(png)}')
          PY
