name: Production security smoke (no secrets or writes)
on:
  pull_request:
    paths: ['.github/workflows/live-production-smoke.yml']
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'web/**'
      - 'wrangler.jsonc'
      - '.github/workflows/live-production-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jpda-live-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check real production endpoints without user tokens or database writes
        run: |
          node --input-type=module <<'NODE'
          const tests=[
            {name:'jpda-health',url:'https://jp-document-assistant.yupan6706.workers.dev/api/health',status:200,check:d=>d?.ok===true&&d?.service==='document-assistant'&&d?.ai_ocr==='disabled'},
            {name:'jpda-first-account',url:'https://jp-document-assistant.yupan6706.workers.dev/api/auth/status',status:200,check:d=>d?.ok===true&&d?.initialized===true},
            {name:'jpda-private-api',url:'https://jp-document-assistant.yupan6706.workers.dev/api/me',status:401},
            {name:'homeflow-no-unauthorized-write',url:'https://homeflow.yupan6706.workers.dev/api/bridge/document-assistant',method:'POST',status:401},
            {name:'kakebo-no-unauthorized-write',url:'https://kakeibo-f17.pages.dev/api/bridge/document-assistant',method:'POST',status:401},
            {name:'zhixue-no-unauthorized-write',url:'https://it-study-platform.yupan6706.workers.dev/api/bridge/document-assistant',method:'POST',status:401}
          ];
          let errors=0;
          for(const t of tests){
            let passed=false,actual='unreachable';
            for(let i=0;i<3;i++){
              const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),18000);
              try{
                const response=await fetch(t.url,{method:t.method||'GET',signal:controller.signal,headers:{'Cache-Control':'no-store'},redirect:'manual'});
                actual=response.status;
                const data=t.check?await response.json().catch(()=>null):null;
                passed=response.status===t.status&&(!t.check||t.check(data));
                if(passed)break;
              }catch(e){actual=e.name||'fetch_error'}
              finally{clearTimeout(timer)}
              await new Promise(resolve=>setTimeout(resolve,2000));
            }
            console.log(t.name+': '+(passed?'PASS':'FAIL')+' (HTTP '+actual+', expected '+t.status+')');
            if(!passed)errors++;
          }

          const base='https://jp-document-assistant.yupan6706.workers.dev';
          const get=async(path)=>{
            const response=await fetch(base+path,{headers:{'Cache-Control':'no-store'}});
            if(response.status!==200)throw new Error(path+' expected HTTP 200, got '+response.status);
            return response;
          };
          const manifest=await (await get('/manifest.webmanifest')).json();
          const expected=[
            ['/icons/app-icon-192.png',192,'any'],
            ['/icons/app-icon-512.png',512,'any'],
            ['/icons/app-icon-maskable-512.png',512,'maskable']
          ];
          if(manifest?.display!=='standalone'||!Array.isArray(manifest.icons)||manifest.icons.length!==3)
            throw new Error('Production PWA manifest structure is invalid');
          for(const [src,size,purpose] of expected){
            const actual=manifest.icons.find(x=>x.src===src);
            if(!actual||actual.sizes!==size+'x'+size||actual.purpose!==purpose||actual.type!=='image/png')
              throw new Error('PWA manifest icon mismatch: '+src);
          }
          const pngFiles=[...expected.map(x=>[x[0],x[1]]),
            ['/icons/apple-touch-icon-180.png',180],['/icons/favicon-32.png',32]];
          for(const [src,size] of pngFiles){
            const response=await get(src);
            const data=new Uint8Array(await response.arrayBuffer());
            if(data.length<100||Array.from(data.slice(0,8)).join(',')!=='137,80,78,71,13,10,26,10')
              throw new Error('Invalid PNG signature or body: '+src);
            const view=new DataView(data.buffer,data.byteOffset,data.byteLength);
            if(view.getUint32(16)!==size||view.getUint32(20)!==size)
              throw new Error('Incorrect PNG dimensions: '+src);
            console.log('PWA icon live: '+src+' ('+size+'x'+size+') PASS');
          }
          const iconSvg=await (await get('/icons/app-icon.svg')).text();
          if(!iconSvg.includes('<svg'))throw new Error('SVG source missing');
          const indexHtml=await (await get('/')).text();
          if(!indexHtml.includes('rel="apple-touch-icon"')||!indexHtml.includes('/icons/favicon-32.png'))
            throw new Error('iPhone home-screen metadata missing');
          console.log('PWA manifest and iOS app icon links: PASS');

          if(errors)throw new Error(errors+' live security checks failed. No actual writes were attempted.');
          console.log('All six real production security checks passed; no auth material provided.');
          NODE
