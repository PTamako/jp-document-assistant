name: Local-only CI (no Cloudflare preview or deployment)
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: local-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frontend/build dependencies
        run: npm install --no-audit --no-fund
      - name: Source syntax
        run: npm run check:syntax
      - name: Unit and in-memory D1 tests
        run: npm test
      - name: Build Vue UI (no deploy)
        run: npm run build
      - name: Check built asset metadata (no network API)
        run: test -f dist/index.html && test -f dist/manifest.webmanifest

      - name: Package production Vue assets for approved manual Cloudflare release (no deploy)
        if: github.event_name == 'pull_request'
        run: |
          tar -czf /tmp/jda-ui-assets.tar.gz -C dist .
          printf 'JDA_ASSET_BEGIN:%s\n' "$GITHUB_SHA"
          base64 -w0 /tmp/jda-ui-assets.tar.gz | fold -w 4096 | sed 's/^/JDA_ASSET_CHUNK:/'
          printf 'JDA_ASSET_END:%s\n' "$(sha256sum /tmp/jda-ui-assets.tar.gz | cut -d ' ' -f1)"

      - name: One-time approved read-only live Worker smoke test
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module <<'JS'
          const base='https://jp-document-assistant.yupan6706.workers.dev';
          const controller=new AbortController();
          const timer=setTimeout(()=>controller.abort(),25000);
          try{
            const [health,home]=await Promise.all([
              fetch(base+'/api/health',{signal:controller.signal}),
              fetch(base+'/',{signal:controller.signal})
            ]);
            const body=await home.text();
            const h=await health.json().catch(()=>null);
            console.log('JDA_LIVE_SMOKE_HEALTH',health.status,JSON.stringify(h));
            console.log('JDA_LIVE_SMOKE_INDEX',home.status,home.headers.get('content-type'),body.length);
            if(!health.ok||!h?.ok||h.service!=='document-assistant')throw new Error('Production health not ready');
            if(!home.ok||!body.includes('id="app"'))throw new Error('Production Vue homepage not ready');
            const js=body.match(/src="([^"]+\.js)"/)?.[1];
            if(!js)throw new Error('JS bundle missing');
            const asset=await fetch(base+js,{signal:controller.signal});
            console.log('JDA_LIVE_SMOKE_JS',asset.status,asset.headers.get('content-type'));
            if(!asset.ok)throw new Error('JS bundle not reachable');
            const paths=['/api/me','/api/documents','/api/recycle','/api/usage','/api/backups/export'];
            const responses=await Promise.all(paths.map(path=>fetch(base+path,{signal:controller.signal})));
            console.log('JDA_LIVE_UNAUTHORIZED_STATUS',responses.map((x,i)=>paths[i]+':'+x.status).join(','));
            if(responses.some(x=>x.status!==401))throw new Error('Production private API did not fail closed');
            const csp=home.headers.get('content-security-policy')||'';
            if(!csp.includes("default-src 'self'"))throw new Error('Expected restrictive CSP');
            if(home.headers.get('x-frame-options')!=='DENY')throw new Error('Missing anti-frame security header');
            console.log('JDA_LIVE_SMOKE_SUCCESS');
          }finally{clearTimeout(timer)}
          JS
