name: Pre-merge CI (Cloudflare handles main deployment)
on:
  pull_request:
concurrency:
  group: local-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frontend/build dependencies
        run: npm ci --no-audit --no-fund
      - name: Source syntax
        run: npm run check:syntax
      - name: Focused shared collaborator upload identity and R2 replay checks
        run: node --test --test-name-pattern="shared collaborator upload" tests/worker.test.js
      - name: Unit and in-memory D1 tests
        run: npm test
      - name: Install official SentencePiece reference for verification
        run: python -m pip install --disable-pip-version-check -q sentencepiece==0.2.1 protobuf==6.32.1
      - name: Validate real pinned Marian tokenizer (public model files only)
        run: node scripts/verify-marian-model.mjs
      - name: Build Vue UI (no deploy)
        run: npm run build
      - name: Check built PWA icon assets (no network API)
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/icons/app-icon.svg
          test -f dist/icons/app-icon-192.png
          test -f dist/icons/app-icon-512.png
          test -f dist/icons/app-icon-maskable-512.png
          test -f dist/icons/apple-touch-icon-180.png
          test -f dist/icons/favicon-32.png
          # The browser must load the SDK from a dedicated module Worker.
          test -n "$(find dist/assets -maxdepth 1 -type f -name 'worker-entry-*.js' -print -quit)"
          # Cloudflare Workers Static Assets impose a 25 MiB single-file maximum.
          test "$(stat -c %s dist/assets/worker-entry-*.js | sort -nr | head -n 1)" -le 26214400
