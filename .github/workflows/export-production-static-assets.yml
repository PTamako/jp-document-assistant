name: Package production static assets (no deployment)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-production-static-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:syntax
      - run: npm run build
      - name: Validate the static bundle matches the new Gemini UI
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('dist/index.html','utf8');
          const path=/src="\/(assets\/index-[^"]+\.js)"/.exec(html)?.[1];
          if(!path)throw Error('Vite JS bundle missing');
          const js=fs.readFileSync('dist/'+path,'utf8');
          if(!js.includes('Gemini 3.5 Flash-Lite'))throw Error('New Gemini model label absent from PWA');
          if(js.includes('Gemini 3.6 Flash'))throw Error('Old Gemini model label remains');
          if(!js.includes('500'))throw Error('New Gemini quota label absent');
          console.log('Verified updated Gemini PWA assets');
          NODE
      - name: Export public static-only build to temporary Git branch (never deploy)
        run: |
          mkdir -p "$RUNNER_TEMP/document-dist"
          cp -a dist/. "$RUNNER_TEMP/document-dist/"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const root=process.env.RUNNER_TEMP+'/document-dist';
          const manifest={};
          function traverse(dir,prefix=''){
            for(const d of fs.readdirSync(dir,{withFileTypes:true})){
              const rel=prefix?prefix+'/'+d.name:d.name,abs=path.join(dir,d.name);
              if(d.isDirectory()){traverse(abs,rel);continue;}
              if(!d.isFile())continue;
              const data=fs.readFileSync(abs);
              const ext=path.extname(rel).replace(/^\./,'');
              const hash=crypto.createHash('sha256').update(data.toString('base64')+ext).digest('hex').slice(0,32);
              manifest['/'+rel]={hash,size:data.length};
            }
          }
          traverse(root);
          if(!manifest['/index.html'])throw Error('Missing app entrypoint');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/document-asset-manifest.json',JSON.stringify(manifest));
          console.log('Prepared',Object.keys(manifest).length,'public files');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan build-only-document-static-20261118
          git rm -r --cached . >/dev/null || true
          mkdir -p static-site
          cp -a "$RUNNER_TEMP/document-dist/." static-site/
          cp "$RUNNER_TEMP/document-asset-manifest.json" cloudflare-asset-manifest.json
          git add -f static-site cloudflare-asset-manifest.json
          git commit -m 'build: public document PWA assets for direct Cloudflare upload'
          git push --force origin HEAD:refs/heads/build-only-document-static-20261118
